name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_BROWSERS_PATH: '0'
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54329
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_browser_fixture
      NEXT_PUBLIC_RENALPLAN_DATED_TEST: '0'
      NEXT_PUBLIC_RENALPLAN_DATED_PRODUCTION: '0'
      NEXT_PUBLIC_RENALPLAN_DATED_LOCAL_LIVE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          # Recipe preservation tests compare against reviewed historical commits.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint:check
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: |
            playwright-report/
            test-results/
          retention-days: 14
